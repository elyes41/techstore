# Pipeline GitHub Actions de TechStore (équivalent du .gitlab-ci.yml)
#   backend / frontend : build sur chaque push et pull request
#   images             : images Docker poussées sur ghcr.io      — branche main
#   deploy             : mise à jour du serveur OVH par SSH       — branche main
#
# Secrets à créer dans Settings > Secrets and variables > Actions :
#   SSH_PRIVATE_KEY   clé privée de l'utilisateur « deploy » du VPS
#   SSH_KNOWN_HOSTS   sortie de : ssh-keyscan <adresse du VPS>
#   DEPLOY_HOST       ex. 51.xx.xx.xx ou vps-xxxx.vps.ovh.net
#   DEPLOY_USER       ex. deploy
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Quarkus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B verify

  frontend:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx ng build

  images:
    name: Images Docker
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Déploiement OVH
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [images]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Clé SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
      - name: Mise à jour du serveur
        env:
          HOST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REGISTRY="ghcr.io/${GITHUB_REPOSITORY,,}"
          scp -i ~/.ssh/id_deploy deploy/docker-compose.prod.yml deploy/Caddyfile "$HOST:/opt/techstore/"
          ssh -i ~/.ssh/id_deploy "$HOST" "cd /opt/techstore \
            && echo '$TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
            && sed -i 's|^REGISTRY=.*|REGISTRY=$REGISTRY|' .env \
            && docker compose -f docker-compose.prod.yml pull \
            && docker compose -f docker-compose.prod.yml up -d --remove-orphans \
            && docker image prune -f \
            && docker logout ghcr.io"
